baseURL: https://viniciusmenezes.dev
defaultContentLanguage: en
defaultContentLanguageInSubdir: true
disableDefaultLanguageRedirect: false
disableLanguages: []
languageCode: en-us
title: Vinicius Menezes
theme: stack

params:
  showtoc: true
  article:
    toc: true
  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: tag-cloud
    page:
      - type: toc
  sidebar:
    avatar: 'images/antonio-hantei.jpg'
    subtitle: 'Here I try to share some of my experiences as an IT student and professional :)'
  opengraph:
    twitter:
      site: ViniMenezesDev

languages:
  en:
    contentDir: content/en
    languageName: English
    weight: 1
    permalinks:
      page:
        post: /article/:slug/
  pt-br:
    contentDir: content/pt-br
    languageName: Português Brasileiro
    weight: 2
    permalinks:
      page:
        post: /artigo/:slug/
    params:
      sidebar:
        subtitle: 'Aqui tento compartilhar um pouco das minhas experiências como estudante e profissional de TI :)'

menu:
  social:
    - identifier: github
      name: GitHub
      url: https://github.com/ViniciusMenezesDev
      weight: 20
      params:
        icon: brand-github
    - identifier: gitlab
      name: GitLab
      url: https://gitlab.com/ViniciusMenezesDev
      weight: 30
      params:
        icon: brand-gitlab
    - identifier: linkedin
      name: LinkedIn
      url: https://www.linkedin.com/in/ViniciusMenezesDev
      weight: 40
      params:
        icon: brand-linkedin
    - identifier: x
      name: X (Twitter)
      url: https://x.com/ViniMenezesDev
      weight: 50
      params:
        icon: brand-x
    - identifier: instagram
      name: Instagram
      url: https://instagram.com/ViniciusMenezesDev
      weight: 60
      params:
        icon: brand-instagram
    - identifier: facebook
      name: Facebook
      url: https://facebook.com/ViniMenezesDev
      weight: 70
      params:
        icon: brand-facebook

  main:
    - identifier: buymeacoffee
      name: Buy Me a Coffee
      url: https://www.buymeacoffee.com/ViniciusMenezesDev
      weight: 40
      params:
        icon: coffee
    - identifier: github-sponsorship
      name: GitHub Sponsorship
      url: https://github.com/sponsors/ViniciusMenezesDev
      weight: 50
      params:
        icon: heart
    - identifier: paypal
      name: PayPal
      url: https://www.paypal.com/donate/?hosted_button_id=JTC8HGVFDSA8W
      weight: 60
      params:
        icon: brand-paypal

caches:
