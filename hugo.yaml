baseURL: https://antoniomedeiros.dev
defaultContentLanguage: en
defaultContentLanguageInSubdir: true
disableDefaultLanguageRedirect: false
disableLanguages: []
languageCode: en-us
title: Antônio Medeiros
theme: stack

params:
  showtoc: true
  article:
    toc: true
  widgets:
    page:
      - type: toc
  sidebar:
    avatar: 'images/antonio-hantei.jpg'
    subtitle: 'Here I try to share some of my experiences as an IT student and professional :)'
  opengraph:
    twitter:
      site: ViniMenezesDev

languages:
  en:
    contentDir: content/en
    languageName: English
    weight: 1
    permalinks:
      page:
        post: /article/:slug/
  pt:
    contentDir: content/pt
    languageCode: pt-br
    languageName: Português Brasileiro
    weight: 2
    permalinks:
      page:
        post: /artigo/:slug/
    params:
      sidebar:
        subtitle: 'Aqui tento compartilhar um pouco das minhas experiências como estudante e profissional de TI :)'

menu:
  main:
    - identifier: github
      name: GitHub
      url: 'https://github.com/viniciusmenezesdev'
      weight: 20
      params:
        icon: github
    - identifier: linkedin
      name: LinkedIn
      url: 'https://www.linkedin.com/in/viniciusmenezesdev'
      weight: 30
      params:
        icon: linkedin

caches:
  images:
    dir: :cacheDir/images